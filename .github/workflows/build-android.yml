name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Export Android APK (Godot 4.7.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Debug Keystore
        run: |
          mkdir -p /home/runner/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /home/runner/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Setup Godot & Export Templates
        run: |
          echo "=== Downloading Godot 4.7.2 ==="
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot

          echo "=== Downloading Export Templates ==="
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q Godot_v4.7.2-stable_export_templates.tpz

          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp -r templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          mkdir -p ~/.local/share/godot/templates/4.7.2.stable
          cp -r templates/* ~/.local/share/godot/templates/4.7.2.stable/

          if [ -f templates/version.txt ]; then
            TVERSION=$(cat templates/version.txt)
            mkdir -p ~/.local/share/godot/export_templates/${TVERSION}
            cp -r templates/* ~/.local/share/godot/export_templates/${TVERSION}/
            mkdir -p ~/.local/share/godot/templates/${TVERSION}
            cp -r templates/* ~/.local/share/godot/templates/${TVERSION}/
          fi
          rm -rf templates *.zip *.tpz

          echo "=== Configuring Editor Settings ==="
          mkdir -p ~/.config/godot
          echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/editor_settings-4.tres
          echo '' >> ~/.config/godot/editor_settings-4.tres
          echo '[resource]' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/android_sdk_path = "/usr/local/lib/android/sdk"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore = "/home/runner/.android/debug.keystore"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_pass = "android"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/shutdown_adb_on_exit = true' >> ~/.config/godot/editor_settings-4.tres
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.7.tres

      - name: Import Godot Assets
        run: |
          echo "=== Importing Assets in Godot ==="
          ./godot --headless --editor --quit || true

      - name: Export APK
        run: |
          mkdir -p build
          ./godot --headless --export-debug "Android" build/DesertOutpost.apk
          if [ ! -f build/DesertOutpost.apk ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi
          ls -lh build/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesertOutpost-APK
          path: build/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Desert Outpost v1.0.${{ github.run_number }}"
          body: |
            ### Desert Outpost (Godot 4.7.2) - Android APK
            * لعبة تصويب تكتيكية ثلاثية الأبعاد (Third-Person Shooter) للهواتف الذكية.
            * خريطة صحراوية كاملة مع تنقل ونظام ملاحة ذكي (Navigation Mesh).
            * ثلاث شخصيات أساسية (Girl, Sana, Soldier) قابلة للعب مع دعم تحكم لمسي كامل.
            * ترسانة أسلحة تشمل AR-9 مع 5 بصريات وسكوبات، وقناص LR-7 بسكوب PIP.
            * ملف APK جاهز للتثبيت واللعب مباشرة.
          files: build/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
